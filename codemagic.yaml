workflows:
  android-unity:
    name: Woulwe Solo Android
    max_build_duration: 60

    environment:
      unity: 2022.3.62f2
      groups:
        - unity_credentials

    scripts:
      - name: Activate Unity license
        script: |
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -nographics -logFile - -serial $UNITY_SERIAL -username $UNITY_EMAIL -password $UNITY_PASSWORD

      - name: Build Android APK
        script: |
          mkdir -p build/outputs
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -nographics -projectPath . -executeMethod BuildScript.BuildAndroid -logFile -

    artifacts:
      - build/outputs/*.apk

    publishing:
      scripts:
        - name: Deactivate Unity license
          script: |
            $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -nographics -logFile - -returnlicense -username $UNITY_EMAIL -password $UNITY_PASSWORD || true
